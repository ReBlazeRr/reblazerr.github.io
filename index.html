<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLOCOIN</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: black;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        .main {
            padding: 50px;
        }
        .highlight {
            color: #00ff00;
        }
        .button {
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #00ff00;
            color: black;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">ZOLOCOIN</div>
        <div class="nav">
            <a href="#">Whitepaper</a>
            <a href="#">Roadmap</a>
            <a href="#">Token Price</a>
            <a href="#">Payments</a>
        </div>
    </div>
    <div class="main">
        <h1>Trust us, we'll figure it out... <span class="highlight">somehow!</span></h1>
        <p>Ready to dive into the chaos?</p>
        <p>Forget about seriousness, we accidentally made crypto and we're going to make it fun and utterly useless!</p>
        <button class="button">Buy token</button>
    </div>
</body>
</html>
